<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devo Visuals</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      background-color: #0d0d0d;
      overflow-x: hidden;
    }

    /* Background image set to 4.jpg with overlay */
    .hero-container {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                  url("4.jpg") repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Header Navigation */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      z-index: 10;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.8;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.7;
    }

    /* Hero Text & CTA */
    .hero-content {
      text-align: center;
      margin: auto 0;
      padding: 0 1rem;
    }

    .hero-title {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .hero-subtitle {
      font-size: clamp(1.2rem, 3vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .btn-outline {
      border: 2px solid #ffffff;
      background: transparent;
      color: #ffffff;
      padding: 0.65rem 1.8rem;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-outline:hover {
      background: #ffffff;
      color: #000000;
    }

    .btn-accent {
      background-color: #2b7fff;
      color: #ffffff;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Decorative Strip at Bottom */
    .film-strip {
      width: 100%;
      height: 16px;
      background: repeating-linear-gradient(
        90deg,
        #ffffff,
        #ffffff 12px,
        #000000 12px,
        #000000 24px
      );
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <header>
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </div>
      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="#services">Services</a>
      </nav>
    </header>

    <div class="hero-content">
      <h1 class="hero-title">CINEMATIC VIDEOS</h1>
      <h2 class="hero-subtitle">WE DO IT RAW</h2>
      <div class="btn-group">
        <a href="#book" class="btn-outline">BOOK NOW</a>
        <button class="btn-accent">Page</button>
      </div>
    </div>

    <div class="film-strip"></div>
  </div>

</body>
</html>
</body>
</html>
