<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVO VISUALS | CINEMATIC FILM & MEDIA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030407;
      --accent: #38bdf8;
    }
    body {
      background-color: var(--bg);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .font-cinematic { font-family: 'Syncopate', sans-serif; }
    
    /* Lewy-Style Ambient Glow & Glass */
    .lewy-glass {
      background: rgba(10, 14, 23, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .lewy-glass:hover {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.12);
    }

    .image-zoom {
      transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .group:hover .image-zoom {
      transform: scale(1.06);
    }
  </style>
</head>
<body class="selection:bg-sky-500 selection:text-black">

  <!-- Header / Navigation -->
  <header class="fixed top-0 left-0 w-full z-50 lewy-glass px-8 py-6 flex justify-between items-center border-b border-white/5">
    <a href="#" class="font-cinematic text-lg font-bold tracking-[0.2em] text-white">
      DEVO<span class="text-sky-400">.</span>VISUALS
    </a>
    <nav class="hidden md:flex space-x-12 font-cinematic text-[10px] tracking-[0.25em] text-slate-400">
      <a href="#work" class="hover:text-white transition">SELECTED WORKS</a>
      <a href="#about" class="hover:text-white transition">DIRECTOR</a>
      <a href="#contact" class="hover:text-white transition">INQUIRE</a>
    </nav>
    <a href="#contact" class="font-cinematic text-[10px] tracking-widest px-6 py-3 bg-white text-black font-bold hover:bg-sky-400 transition">
      BOOK NOW
    </a>
  </header>

  <!-- Lewy Films Full-Screen Hero -->
  <section class="relative h-screen flex items-center justify-center px-6 overflow-hidden">
    <!-- Cinematic Dark Overlay & Master Image -->
    <div class="absolute inset-0 z-0">
      <img src="1.jpg" class="w-full h-full object-cover filter brightness-50 contrast-125 scale-105" alt="Devo Visuals Cinema">
      <div class="absolute inset-0 bg-gradient-to-t from-[#030407] via-transparent to-[#030407]/80"></div>
    </div>

    <div class="relative z-10 text-center max-w-5xl mx-auto pt-20">
      <p class="font-cinematic text-[10px] md:text-xs text-sky-400 tracking-[0.4em] mb-6 uppercase">QUAD CITIES // WEDDING MEDIA & CINEMATOGRAPHY</p>
      <h1 class="font-cinematic text-4xl md:text-7xl font-bold tracking-tight text-white mb-8 leading-tight">
        STORIES TOLD WITH <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-sky-400">CINEMATIC INTENSITY</span>
      </h1>
