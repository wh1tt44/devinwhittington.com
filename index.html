<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVO VISUALS // CINEMATIC STUDIOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ffffff;
      --accent: #38bdf8;
      --bg: #030407;
    }
    body {
      background-color: var(--bg);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      cursor: crosshair;
    }
    .font-cinematic { font-family: 'Syncopate', sans-serif; }
    
    /* Luxury Glassmorphism Panels */
    .lewy-glass {
      background: rgba(10, 14, 23, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .lewy-glass:hover {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.1);
    }
    
    /* Cinematic Grain Overlay */
    .film-grain {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=200&q=10');
      opacity: 0.03; pointer-events: none; z-index: 999;
    }
  </style>
</head>
<body class="selection:bg-sky-500 selection:text-black">

  <div class="film-grain"></div>

  <!-- Minimalist Luxury Nav -->
  <header class="fixed top-0 left-0 w-full z-50 lewy-glass px-8 py-6 flex justify-between items-center border-b border-white/5">
    <div class="font-cinematic text-lg font-bold tracking-widest text-white">
      DEVO<span class="text-sky-400">.</span>VISUALS
    </div>
    <nav class="hidden md:flex space-x-12 font-cinematic text-[10px] tracking-[0.25em] text-slate-400">
      <a href="#masterpieces" class="hover:text-white transition">WORKS</a>
      <a href="#studio" class="hover:text-white transition">STUDIO</a>
      <a href="#inquire" class="hover:text-white transition">INQUIRE</a>
    </nav>
    <a href="#inquire" class="font-cinematic text-[10px] tracking-widest px-6 py-3 bg-white text-black font-bold hover:bg-sky-400 transition">
      BOOK SESSION
    </a>
  </header>

  <!-- Cinematic Hero Section -->
  <section class="relative h-screen flex items-center justify-center px-4 overflow-hidden">
    <div class="absolute inset-0 z-0">
      <img src="1.jpg" class="w-full h-full object-cover opacity-30 scale-105 filter brightness-75" alt="Hero Background" onerror="this.src='https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80'">
      <div class="absolute inset-0 bg-gradient-to-t from-[#030407] via-transparent to-[#030407]"></div>
    </div>

    <div class="relative z-10 text-center max-w-5xl mx-auto">
      <p class="font-cinematic text-[10px] md:text-xs text-sky-400 tracking-[0.4em] mb-6 uppercase">QUAD CITIES // CINEMATIC WEDDING & MEDIA PRODUCTION</p>
      <h1 class="font-cinematic text-4xl md:text-7xl font-bold tracking-tight text-white mb-8 leading-tight">
        UNCOMPROMISING <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-300 to-sky-400">VISUAL CRAFT</span>
      </h1>
      <div class="flex justify-center gap-6 font-cinematic text-[10px]">
        <a href="#masterpieces" class="px-8 py-4 border border-white/20 text-white hover:bg-white hover:text-black transition tracking-widest">EXPLORE GALLERY</a>
      </div>
    </div>
  </section>

  <!-- Interactive Lewy Films Style Masterpiece Gallery -->
  <section id="masterpieces" class="py-32 px-6 md:px-16 max-w-7xl mx-auto">
    <div class="flex justify-between items-end mb-16 border-b border-white/10 pb-6">
      <div>
        <p class="font-cinematic text-[10px] text-sky-400 tracking-[0.3em] mb-2">CURATED ARCHIVE</p>
        <h2 class="font-cinematic text-3xl md:text-5xl font-bold text-white tracking-wider">TOP 10 MASTERPIECES</h2>
      </div>
      <div class="hidden md:flex gap-3 font-cinematic text-[10px]">
        <button onclick="setMode('ripple')" id="btn-ripple" class="px-4 py-2 border border-sky-400 text-sky-400">MODE // RIPPLE</button>
        <button onclick="setMode('glitch')" id="btn-glitch" class="px-4 py-2 border border-white/10 text-slate-400 hover:text-white">MODE // DISPLACE</button>
      </div>
    </div>

    <!-- Main Dynamic Viewer Stage -->
    <div class="lewy-glass rounded-2xl p-6 relative mb-12 overflow-hidden shadow-2xl">
      <div class="relative w-full aspect
